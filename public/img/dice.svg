<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A die seen from slightly above, with a question mark on each visible face (the "Random" choice). -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#c2cad4"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdd4dc"/>
      <stop offset="1" stop-color="#9fa9b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke="#7d8794" stroke-width="1.5" stroke-linejoin="round">
    <path d="M64 14 L108 36 L64 58 L20 36 Z" fill="url(#top)"/>
    <path d="M20 36 L64 58 L64 112 L20 88 Z" fill="url(#left)"/>
    <path d="M108 36 L64 58 L64 112 L108 88 Z" fill="url(#right)"/>
  </g>
  <!-- Each "?" is drawn flat and mapped onto its face with a skew matrix. -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="34" text-anchor="middle" dominant-baseline="central">
    <text transform="matrix(0.85 0.425 -0.85 0.425 64 36)" fill="#e2353a">?</text>
    <text transform="matrix(0.85 0.425 0 1 42 74)" fill="#2a2f36">?</text>
    <text transform="matrix(0.85 -0.425 0 1 86 74)" fill="#2a2f36">?</text>
  </g>
</svg>
