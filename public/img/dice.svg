<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A die seen from slightly above: top, left and right faces, lit from the top left. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#c2cad4"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cdd4dc"/>
      <stop offset="1" stop-color="#9fa9b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke="#7d8794" stroke-width="1.5" stroke-linejoin="round">
    <path d="M64 14 L108 36 L64 58 L20 36 Z" fill="url(#top)"/>
    <path d="M20 36 L64 58 L64 112 L20 88 Z" fill="url(#left)"/>
    <path d="M108 36 L64 58 L64 112 L108 88 Z" fill="url(#right)"/>
  </g>
  <!-- Top face: 1 (red, like a real die). -->
  <ellipse cx="64" cy="36" rx="9" ry="5" fill="#e2353a"/>
  <!-- Left face: 3 diagonally. -->
  <g fill="#2a2f36">
    <ellipse cx="31" cy="54" rx="4.6" ry="5.6"/>
    <ellipse cx="42" cy="73" rx="4.6" ry="5.6"/>
    <ellipse cx="53" cy="92" rx="4.6" ry="5.6"/>
  </g>
  <!-- Right face: 5. -->
  <g fill="#2a2f36">
    <ellipse cx="75" cy="66" rx="4.6" ry="5.6"/>
    <ellipse cx="97" cy="55" rx="4.6" ry="5.6"/>
    <ellipse cx="86" cy="73.5" rx="4.6" ry="5.6"/>
    <ellipse cx="75" cy="93" rx="4.6" ry="5.6"/>
    <ellipse cx="97" cy="82" rx="4.6" ry="5.6"/>
  </g>
</svg>
