<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Lightning faction badge: a glowing bolt on a round token. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3a3f9a"/>
      <stop offset="1" stop-color="#151735"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="1" stop-color="#ffc21c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#disc)" stroke="#ffd23c" stroke-width="3"/>
  <path d="M72 18 L38 70 L60 70 L52 110 L90 52 L67 52 L78 18 Z" fill="url(#bolt)" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
